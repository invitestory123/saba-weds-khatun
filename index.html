  <body>
    <button id="bg-music-toggle" type="button" aria-label="Toggle background music" aria-pressed="false" title="Background Music">
      <span class="music-disc-wrapper">
        <svg class="music-icon-playing" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <svg class="music-icon-muted" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
          <line x1="2" y1="2" x2="22" y2="22"></line>
        </svg>
      </span>
    </button>
    <audio id="weddingBgm" src="./editable/assets/bg-music.mp3" preload="auto" loop playsinline webkit-playsinline></audio>
    <style>
      #bg-music-toggle {
        position: fixed;
        top: 18px;
        right: 18px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(253, 248, 239, 0.94);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(212, 175, 55, 0.55);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1), 0 0 12px rgba(212, 175, 55, 0.28);
        color: #9c6c24;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 9999;
        transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      }
      #bg-music-toggle:hover {
        transform: scale(1.08);
        border-color: #7b5629;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.15), 0 0 16px rgba(212, 175, 55, 0.45);
      }
      #bg-music-toggle:active {
        transform: scale(0.94);
      }
      @keyframes music-rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      #bg-music-toggle.is-active .music-disc-wrapper {
        display: inline-flex;
        animation: music-rotate 5s linear infinite;
      }
    </style>
    <div id="root"></div>
  </body>
